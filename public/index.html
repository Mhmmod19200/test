<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="العب تيك تاك تو (إكس أو) اونلاين مع الأصدقاء أو ضد الكمبيوتر أو لاعب آخر محلياً. لعبة بسيطة وممتعة.">
  <title>لعبة إكس أو (Tic Tac Toe) أونلاين ومحلية</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://cdn.socket.io" crossorigin>
  <!-- يمكنك إضافة رابط أيقونة الموقع (Favicon) هنا -->
  <!-- <link rel="icon" href="/favicon.ico" type="image/x-icon"> -->
</head>
<body>

  <!-- شاشة البداية (Overlay 1) -->
  <div id="start-screen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="start-heading">
    <h1 id="start-heading">اختر وضع اللعب</h1>
    <button id="btn-local" aria-label="بدء لعبة لاعب ضد لاعب محلي">1v1 محلي</button>
    <button id="btn-ai" aria-label="بدء لعبة ضد الذكاء الاصطناعي">ضد AI</button>
    <button id="btn-online" aria-label="بدء لعبة أونلاين عبر الإنترنت">أونلاين</button>
  </div>

  <!-- واجهة الأونلاين (Overlay 2) -->
  <div id="online-ui" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="online-heading">
    <h2 id="online-heading">اللعب أونلاين</h2>
    <button id="btn-create" aria-label="إنشاء غرفة لعب جديدة">إنشاء غرفة</button>
    <div>
      <label for="room-input" class="visually-hidden">أدخل رمز الغرفة للانضمام</label>
      <input id="room-input" type="text" maxlength="6" placeholder="رمز الغرفة" aria-label="رمز الغرفة للانضمام">
      <button id="btn-join" aria-label="الانضمام إلى غرفة موجودة باستخدام الرمز المدخل">انضمام</button>
    </div>
    <div id="room-display" aria-live="polite"></div>
    <div id="waiting-msg" aria-live="polite"></div>
     <button id="btn-back-online" aria-label="الرجوع إلى شاشة اختيار الوضع">رجوع</button> <!-- زر رجوع جديد -->
  </div>

  <!-- منطقة اللعبة الرئيسية -->
  <div id="game-container" class="main-container hidden">
    <main>
      <div id="status" aria-live="polite"></div>

      <div id="board" class="board" role="grid" aria-label="لوحة لعبة إكس أو">
        <div class="cell" role="gridcell" data-index="0" aria-label="خلية 1"></div>
        <div class="cell" role="gridcell" data-index="1" aria-label="خلية 2"></div>
        <div class="cell" role="gridcell" data-index="2" aria-label="خلية 3"></div>
        <div class="cell" role="gridcell" data-index="3" aria-label="خلية 4"></div>
        <div class="cell" role="gridcell" data-index="4" aria-label="خلية 5"></div>
        <div class="cell" role="gridcell" data-index="5" aria-label="خلية 6"></div>
        <div class="cell" role="gridcell" data-index="6" aria-label="خلية 7"></div>
        <div class="cell" role="gridcell" data-index="7" aria-label="خلية 8"></div>
        <div class="cell" role="gridcell" data-index="8" aria-label="خلية 9"></div>
      </div>

      <div class="game-controls"> <!-- حاوية لأزرار التحكم باللعبة -->
          <button id="btn-reset" aria-label="إعادة بدء الجولة الحالية">إعادة</button>
          <button id="btn-back-game" aria-label="الرجوع إلى شاشة اختيار الوضع">القائمة الرئيسية</button> <!-- زر رجوع جديد -->
      </div>

      <div id="scores" aria-label="النتائج الحالية">
        <span aria-label="نقاط اللاعب إكس">X: <span id="score-x">0</span></span>
        <span aria-label="نقاط اللاعب أو">O: <span id="score-o">0</span></span>
        <span aria-label="عدد جولات التعادل">تعادل: <span id="score-d">0</span></span>
      </div>

      <section id="chat-container" aria-labelledby="chat-heading">
        <h3 id="chat-heading" class="visually-hidden">صندوق الدردشة (أونلاين فقط)</h3>
        <div id="chat-box" aria-live="polite"></div>
        <div class="chat-input-area">
          <label for="chat-input" class="visually-hidden">اكتب رسالتك هنا</label>
          <input id="chat-input" placeholder="اكتب رسالة..." aria-label="صندوق إدخال رسالة الدردشة">
          <button id="chat-send" aria-label="إرسال الرسالة">إرسال</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ملف الصوت للإشعارات -->
  <!-- تأكد من أن المسار صحيح -->
  <audio id="chat-sound" src="sounds/notification.mp3" preload="auto"></audio>

  <!-- ملفات السكربت -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
